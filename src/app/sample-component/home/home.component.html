<div class="page-content-container">
  <div class="p-2 mt-3">
    <div class="grid">
      <div class="col-12">
        <h1>สวัสดี นี่คือหน้าแรก</h1>
      </div>

      <div class="col-12">
        <input pInputText type="text" placeholder="กรอก Username" [(ngModel)]="input_username" />
      </div>
      <div class="col-12 flex gap-2">
        <button pButton type="button" label="บันทึก Username" class="p-button-primary p-button-sm" icon="pi pi-save"
          (click)="saveUsername()">
        </button>
        <button pButton type="button" label="ล้าง Username" class="p-button-danger p-button-sm" icon="pi pi-times"
          (click)="clearUsername()">
        </button>
      </div>

      <div class="col-12">
        <ul>
          <li *ngFor="let user of users">
            {{ user.full_name }} - {{ user.username }} - {{ user.birthday | bdate }}
          </li>
        </ul>
      </div>

      <div class="col-12">
        <page1></page1>
      </div>

      <div class="col-12">
        Home Component ========
        <p>Non Two Way: {{ non_two_way_value }} | Two Way: {{ two_way_value }}</p>
      </div>
      <div class="col-12 flex gap-2">
        <button pButton type="button" label="+1 Non Two Way" class="p-button-info p-button-sm"
          (click)="updateNonTwoWay()">
        </button>
        <button pButton type="button" label="+1 Two Way" class="p-button-success p-button-sm" (click)="updateTwoWay()">
        </button>
      </div>

      <div class="col-12">
        Test Component ========
        <test-component [non_two_way]="non_two_way_value" [(two_way)]="two_way_value"></test-component>
      </div>
    </div>
  </div>
</div>
